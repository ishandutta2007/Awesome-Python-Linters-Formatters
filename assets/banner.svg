<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="40%" stop-color="#0D1527" />
      <stop offset="70%" stop-color="#141E36" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="cyanPurpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="pythonYellowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#387EB8" />
      <stop offset="100%" stop-color="#FFE873" />
    </linearGradient>

    <radialGradient id="meshSphere1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshSphere2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1deg); }
      }
      @keyframes pulseSphere {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes badgeGlow {
        0%, 100% { stroke: rgba(56, 189, 248, 0.4); }
        50% { stroke: rgba(192, 132, 252, 0.8); }
      }

      .floating-card-1 {
        animation: floatSlow1 7s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-2 {
        animation: floatSlow2 8.5s ease-in-out infinite;
        transform-origin: center;
      }
      .pulsing-sphere-1 {
        animation: pulseSphere 6s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .pulsing-sphere-2 {
        animation: pulseSphere 8s ease-in-out infinite;
        transform-origin: 1000px 300px;
      }
      .animated-stream {
        stroke-dasharray: 8, 12;
        animation: dashMove 12s linear infinite;
      }
      .interactive-pill {
        animation: badgeGlow 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Ambient Spheres (Behind all content) -->
  <g opacity="0.8">
    <circle class="pulsing-sphere-1" cx="200" cy="100" r="180" fill="url(#meshSphere1)" />
    <circle class="pulsing-sphere-2" cx="1000" cy="300" r="220" fill="url(#meshSphere2)" />
  </g>

  <!-- Futuristic Grid Matrix (Background only) -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Background Data Flow Lines (Dynamic aspect) -->
  <g fill="none" opacity="0.4">
    <path class="animated-stream" d="M -50 90 Q 300 20 600 90 T 1250 80" stroke="#38BDF8" stroke-width="1.8" />
    <path class="animated-stream" d="M -50 340 Q 350 390 700 320 T 1250 360" stroke="#818CF8" stroke-width="1.8" />
    <path class="animated-stream" d="M -50 200 C 400 320, 800 80, 1250 220" stroke="#C084FC" stroke-width="1.2" opacity="0.3" />
  </g>

  <!-- Subtle Floating Decorative Background Chips (Positioned on sides, well clear of center text) -->
  <g class="floating-card-1" opacity="0.65">
    <!-- Left Background Pill: Ruff & Rust Speed -->
    <rect x="50" y="55" width="180" height="42" rx="21" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="72" cy="76" r="6" fill="#F97316" />
    <text x="88" y="82" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ Ruff: 900+ Rules</text>

    <!-- Left Background Pill: Flake8 & Pylint -->
    <rect x="70" y="315" width="170" height="42" rx="21" fill="#0F172A" stroke="#818CF8" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="92" cy="336" r="6" fill="#38BDF8" />
    <text x="108" y="342" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🔍 Deep AST Linting</text>
  </g>

  <g class="floating-card-2" opacity="0.65">
    <!-- Right Background Pill: Black Formatter -->
    <rect x="970" y="60" width="180" height="42" rx="21" fill="#0F172A" stroke="#C084FC" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="992" cy="81" r="6" fill="#10B981" />
    <text x="1008" y="87" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">✨ Black: Zero-Config</text>

    <!-- Right Background Pill: Static Type Checker -->
    <rect x="960" y="310" width="190" height="42" rx="21" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="982" cy="331" r="6" fill="#FFE873" />
    <text x="998" y="337" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🛡️ Mypy &amp; Pyright Typings</text>
  </g>

  <!-- FOREGROUND LAYER: Primary Title, Subtitle, Badges (Rendered ON TOP of all dynamic elements) -->
  <g id="foreground" transform="translate(0, 0)">
    
    <!-- Top Category Tag -->
    <g transform="translate(600, 72)">
      <rect class="interactive-pill" x="-165" y="-18" width="330" height="36" rx="18" fill="#111C35" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
      <!-- Python dual-color dot -->
      <circle cx="-135" cy="0" r="5" fill="#38BDF8" />
      <circle cx="-123" cy="0" r="5" fill="#FFE873" />
      <text x="-105" y="5" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.2">CURATED DEVELOPER ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.8">
      Awesome Python Linters &amp; Formatters
    </text>

    <!-- Decorative Gradient Title Underline -->
    <rect x="420" y="172" width="360" height="4" rx="2" fill="url(#cyanPurpleGlow)" />

    <!-- Subtitle / Value Proposition (High contrast, clearly legible) -->
    <text x="600" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#CBD5E1">
      Curated directory of Rust-accelerated linters, uncompromising formatters &amp; deep static analysis tools
    </text>

    <text x="600" y="246" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#94A3B8">
      Standardize code quality • Accelerate CI pipelines • Eliminate style debates across Python codebases
    </text>

    <!-- Interactive Bottom Feature Badges / Highlights -->
    <g transform="translate(600, 315)">
      <!-- Badge 1: Rust Speed -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="0" width="165" height="36" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
        <text x="82" y="22.5" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700">⚡ 100x Speedup</text>
      </g>

      <!-- Badge 2: PEP 8 Standards -->
      <g transform="translate(-180, 0)">
        <rect x="0" y="0" width="165" height="36" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
        <text x="82" y="22.5" text-anchor="middle" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700">📐 PEP 8 Compliant</text>
      </g>

      <!-- Badge 3: Type Safety -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="170" height="36" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
        <text x="85" y="22.5" text-anchor="middle" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700">🛡️ Strict Type Safety</text>
      </g>

      <!-- Badge 4: Automated CI -->
      <g transform="translate(185, 0)">
        <rect x="0" y="0" width="175" height="36" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
        <text x="87" y="22.5" text-anchor="middle" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700">🚀 CI/CD Pre-Commit</text>
      </g>
    </g>

  </g>

  <!-- Crisp Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#1E293B" stroke-width="2" />
</svg>